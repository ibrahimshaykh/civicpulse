name: ci
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIAGE_PROVIDER: simulated

jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: Backend lint and types
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend lint and types
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Regenerate OpenAPI and client, fail on drift
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          REDIS_PASSWORD: ci-only-placeholder
        run: |
          cd backend && uv sync --frozen && uv run python -m app.cli export-openapi > openapi.json && cd ..
          cd frontend && npm ci && npm run gen:api && cd ..
          git diff --exit-code -- backend/openapi.json frontend/src/api/schema.d.ts

  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: STATUS.md must match docs/progress.toml
        run: python scripts/update_status.py --check

  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - name: pytest (testcontainers uses the runner's Docker)
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
          POSTGRES_PASSWORD: ci-only-placeholder
          REDIS_PASSWORD: ci-only-placeholder
        run: |
          uv sync --frozen
          # HTTPS_PROXY scoped to just the test run, not `uv sync` above: uv still
          # needs real network to fetch packages on a cache miss, but the tests
          # themselves must make zero outbound calls -- any accidental one now
          # fails fast instead of silently succeeding against the real network.
          # -m "not integration": tests needing a live Postgres/Redis wait for
          # CI-02's Compose integration job; conftest.py has no testcontainers
          # wiring yet (BE-07), so this runner has nothing for them to reach.
          HTTPS_PROXY=http://127.0.0.1:9 uv run pytest -q -m "not integration" --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: backend/coverage.xml, retention-days: 7 }

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm run test:ci
          npm run build

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci -f backend/Dockerfile backend
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci -f frontend/Dockerfile frontend
      # CRITICAL only, not HIGH: this scans the exact base images the plan
      # pins (python:3.12-slim, node:22-alpine/nginx-unprivileged), and a
      # HIGH-severity gate on someone else's base image would block every
      # PR on CVEs this project has no way to fix by Monday night. CRITICAL
      # is the bar that's actually enforceable.
      - name: Trivy -- backend
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: civicpulse-backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy -- frontend
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: civicpulse-frontend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifest-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (K8s manifests, once they exist)
        run: |
          # No-op, not a failure, until K8-01+ commit manifests under k8s/ --
          # the job exists now so CI-05's later gate on it needs no new wiring.
          files=$(find k8s -name '*.yaml' -o -name '*.yml' 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "no k8s manifests yet -- nothing to validate"
            exit 0
          fi
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          echo "$files" | xargs ./kubeconform -strict -summary
