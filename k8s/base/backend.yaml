apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # BE-06's own documented timeline (backend/app/server.py): preStop (5s)
      # + graceful_timeout_s (20s) < terminationGracePeriodSeconds (30s) is
      # the whole design -- BE-06 owns the first two numbers, this file the
      # third.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/ibrahimshaykh/civicpulse-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: civicpulse-config }
            - secretRef: { name: civicpulse-secrets }
          lifecycle:
            preStop:
              # Gives the Service/Ingress time to stop sending new traffic
              # before SIGTERM reaches GracefulServer.handle_exit.
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 } # never touches the DB (rubric C4)
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: 8000 } # DB + Redis reachability
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests: { cpu: "100m", memory: "160Mi" }
            limits: { cpu: "500m", memory: "320Mi" }
