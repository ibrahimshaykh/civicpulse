[project]
name = "civicpulse-backend"
version = "1.0.0"
description = "CivicPulse API: municipal complaint triage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic==2.9.*",
  "pydantic-settings==2.6.*",
  "sqlalchemy[asyncio]==2.0.*",
  "asyncpg==0.30.*",
  "alembic==1.14.*",
  "redis==5.*",
  "openai==1.*",
  "httpx==0.27.*",
  "structlog==24.*",
  "prometheus-client==0.21.*",
]

[dependency-groups]
# types-redis from the plan is left out: redis-py 5 ships its own type hints
# and the stale stubs would shadow them.
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "testcontainers[postgres,redis]",
  "fakeredis",
  "ruff",
  "mypy",
]

[tool.uv]
# The backend is an application, not a library: no wheel is built.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres and Redis containers"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/server.py"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PT", "SIM", "TID"]
ignore = ["S101"] # assert in tests

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "SQLAlchemy is only allowed in app/repositories and app/db"

[tool.ruff.lint.per-file-ignores]
# "No SQL outside repositories" is a lint failure, not just a review comment (plan §10.1).
"app/repositories/**" = ["TID251"]
"app/db/**" = ["TID251"]
"alembic/**" = ["TID251"]
"tests/**" = ["TID251", "S106"] # S106: obviously-fake passwords used to prove they're hidden

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
