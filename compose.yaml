# Data tier (DK-03) + app tier (DK-04): migrate/seed run once and exit,
# backend/frontend stay up. "database" and "cache" are not arbitrary names:
# they're the exact defaults Settings.postgres_host / Settings.redis_host
# already fall back to (backend/app/core/config.py), so the backend needs
# no host override to reach them from inside the "data" network.

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    # AOF (not just RDB snapshots) on a named volume: a stats-cache miss is
    # cheap to recompute, but the rate limiter's window counters and the
    # triage outcome ring buffer are live state a plain restart shouldn't
    # silently reset mid-window.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      # A single $: compose substitutes this at parse time from .env, same as
      # the `command` line above -- redis-cli's shell never sees the
      # variable at all, so it doesn't need to be in the container's own env.
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: runs `alembic upgrade head` and exits 0. On the data network
  # only -- it never serves traffic, so it has no business on the app
  # network. `restart: "no"` keeps a failed migration failed, not looping.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - data
    restart: "no"
    depends_on:
      database:
        condition: service_healthy

  # One-shot, idempotent (DB-03's ON CONFLICT DO NOTHING): safe to run on
  # every `compose up`, not just the first.
  seed:
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "seed"]
    environment:
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - data
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: database
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-simulated}
      APP_ENV: prod
    networks:
      - data # reaches Postgres/Redis
      - app # reaches (and is reached by) the frontend's nginx proxy
    healthcheck:
      # No curl/wget in python:3.12-slim; the venv's own python (already on
      # PATH) can make the same GET without adding a package to the image.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    ports:
      - "8080:8080" # the only port this stack publishes to the host
    networks:
      - app # never `data` -- rubric G3: the frontend provably cannot reach the DB
    depends_on:
      backend:
        condition: service_healthy

networks:
  # No ports published here: neither database nor cache is reachable except
  # from another container already on this network.
  data:
    internal: true
  # Backend <-> frontend only. Not internal: the host needs to reach the
  # frontend's published port through it.
  app: {}

volumes:
  pgdata:
  redis-data:
