  { date = "2026-09-27", text = "FE-07 + FE-08: Dashboard table (priority rail, category glyph, provider tag), URL-driven filters/pagination with defensive enum parsing, StatusActions with zero client-side transition table (primary buttons from allowed_transitions, Other-status menu, verbatim 409). Fixed MSW fixture dates from static future dates to dynamic offsets so relative time renders correctly; made relativeTime() robust to any date sign. 4 component tests (plan section 8.14 tests 7-10), checked visually end to end with Playwright including the 409 flow and a live URL-sync check." },
  { date = "2026-09-27", text = "FE-09: Stats page -- CacheIndicator (HIT/MISS, fetched time, Refresh, 10s auto-refresh toggle), CSS-only CountBars for category/priority/status (no chart library), providers panel (active provider, model, cache hit rate, last-20 outcomes table with the fallback dashed-outline styling reused from ProviderTag). 3 component tests. Checked visually with Playwright, zero console errors." },
  { date = "2026-09-27", text = "BE-01: Settings (env-only, SecretStr for passwords/API key), structlog JSON-to-stdout logging, a pure-ASGI RequestContextMiddleware (X-Request-ID echo/generate, Prometheus HTTP metrics via a dedicated CollectorRegistry, request_completed log line), the DomainError hierarchy + handlers (400/404/409/429/500, one envelope), a minimal lifecycle.py, create_app() wiring. Fixed a real bug in the plan's own literal code: computed_field(repr=False) is required or Settings.__repr__ leaks the DB password in plaintext through the assembled URL. Also swapped sqlalchemy.URL for a hand-built DSN, since app/core may not import sqlalchemy at all under our own layering rule. 3 new tests (U8, U10, I15-equivalent using capsys since structlog.testing.capture_logs bypasses the real processor chain)." },
  { date = "2026-09-27", text = "DB-01: app/db/base.py (naming convention, timestamptz type map), app/db/models.py (ComplaintORM matching plan section 9.1's table exactly -- verified by compiling every column against the real Postgres dialect), app/db/session.py (engine/sessionmaker factories). No Docker/Postgres in this sandbox, so verified via SQLAlchemy metadata introspection instead of a live database: 11 tests check column types, check-constraint names against the naming convention, both indexes, and that CreateTable DDL alone never emits CREATE TYPE (that only happens via metadata.create_all(), which app code never calls). DB-02 (Alembic) and a real Postgres round-trip are still needed before this is fully proven end to end." },
  { date = "2026-09-27", text = "DB-03: idempotent seed CLI (uv run python -m app.cli seed). SEED_NAMESPACE + uuid5(slug) gives every row a stable, deterministic id across machines and runs; insert_if_absent does ON CONFLICT (id) DO NOTHING via Postgres, so seeding twice inserts 0 rows the second time. 33 hand-written rows in app/seed/complaints.json (Urdu-English mixed text like the brief asks for, hand-written English summaries), covering every category (water 6, electricity 6, sanitation 6, roads 6, streetlights 5, other 4) and every status (open 17, in_progress 9, resolved 4, rejected 3), created_at spread over the last 14 days. The seed never calls an LLM: triaged_by is always rules, latency 0. Minimal ComplaintRepository added with just insert_if_absent (BE-02 extends it with get/list/update_status). No Docker/Postgres here, so verified two ways that need no live database: the seed algorithm itself against a fake in-memory repository (first run inserts 33, second run inserts 0, deterministic ids confirmed across two calls), and the real repository's SQL compiled against the postgresql dialect to confirm the ON CONFLICT/RETURNING clauses are correct. A live seed-twice-against-real-Postgres run is still needed once Docker exists." },
  { date = "2026-09-27", text = "CA-01: StatsCache (Redis read-through, fails open on RedisError so a Redis blip degrades to always-compute rather than an outage) and ComplaintRepository.aggregate() (one GROUPING SETS query for category/priority/status/grand-total, zero-filled against every enum member in Python). StatsService wires the two together (HIT returns cached, MISS computes+populates) and app/api/deps.py + a real lifespan (app/core/lifecycle.py now actually builds the Postgres engine, sessionmaker and Redis client and stores them on app.state, closing both on shutdown) wire the real GET /api/stats route, replacing the C0-05 stub. No Docker/Postgres/Redis in this sandbox, so verified three ways that need no live infrastructure: the GROUPING SETS SQL compiled and read directly (WHERE/GROUP BY/grouping() calls all checked), the row-to-aggregate bucketing logic against hand-built rows including the empty-table case, and the cache itself against fakeredis (an in-process Redis-protocol implementation, not a hand-rolled fake) covering get/set/TTL/invalidate and the fail-open path. The real route is tested via FastAPI's own dependency_overrides (the standard way to test a route apart from its infrastructure, not a workaround). A real request that actually reaches Redis and Postgres together is still open once Docker exists." },
  { date = "2026-09-27", text = "BE-05: real /ready (HealthRepository.ping_db doing SELECT 1, ReadinessService probing Postgres and Redis concurrently under a timeout, a shutting_down check that skips both probes and fails immediately so a draining pod leaves the Service's endpoint list fast). /health stays a plain no-Depends, no-I/O liveness check. /metrics was already wired in BE-01. This is the strongest verification so far without Docker: rather than only simulating failures, the readiness tests connect a real (though unreachable) Postgres engine and a real Redis client to 10.255.255.1 -- a private, unrouted address -- and confirm the connect timeout actually fires within 0.3-0.5s and /ready correctly names which dependency failed. Also covered with fast fakes: both-ok, either/both failing, a hung dependency timing out instead of hanging the whole check, and the shutting_down short-circuit (proven to never even touch either dependency). The real route is tested via dependency_overrides, including that /health genuinely never builds or touches a database session. Regenerated backend/openapi.json (the /ready response shape changed) and the frontend's generated schema.d.ts to match, keeping both sides of the contract honest." },
  { date = "2026-09-27", text = "BE-02: full ComplaintRepository (insert, insert_if_absent, get, get_status, list_page with filters/pagination/id-DESC tiebreaker, update_status_if using optimistic concurrency -- the WHERE clause requires the row to still be in the expected status, so two operators racing on the same complaint cannot both succeed), plus ComplaintRecord (app/domain/records.py, a frozen dataclass -- repositories never return the ORM object, so services can never trigger a lazy-load outside a session) and the UnitOfWork split (app/services/uow.py holds a Protocol with no sqlalchemy import at all -- verified the ban still fires by probing it directly; app/repositories/uow.py holds the real SqlAlchemyUoW). Every query is a standalone statement-builder function, separate from the async execute call, specifically so it can be compiled and checked without a database connection. No Docker/Postgres in this sandbox, so BE-02's stated acceptance (I4, I5, both live-database integration tests) could not be run end to end here: verified instead by compiling every statement against the real Postgres dialect (WHERE/ORDER BY/LIMIT/OFFSET/ON CONFLICT/RETURNING all checked), and by testing the row-to-record mapping and the UoW's delegation against fakes. A real GET/LIST round-trip against Postgres (I4, I5) still needs to run once Docker exists." },
  { date = "2026-09-27", text = "DB-02: async Alembic env.py (target_metadata=Base.metadata, compare_type/compare_server_default, an advisory lock around do_run_migrations so two backend pods cannot migrate concurrently, URL from Settings() not alembic.ini). Migration 0001 creates the three Postgres enums, the complaints table with all six check constraints and both indexes, and the updated_at trigger. Found and fixed a real bug while testing offline: hand-writing constraint names as the full ck_complaints_* form in the migration produced double-prefixed names (ck_complaints_ck_complaints_text_length), because op.create_table re-applies the naming convention on top of an already-given name; switched to the same short names the ORM model uses. No Docker/Postgres here, so verified with alembic upgrade/downgrade --sql (offline mode, no DBAPI needed) plus a new regression test that diffs the migration's generated DDL against the model's own compiled DDL byte-for-byte -- confirmed it actually catches drift by deliberately breaking a column length and watching the test fail, then restored it. This stands in for alembic check, which needs a live database; a real up/down/up cycle (I21) still needs to run once Docker exists." },
  { date = "2026-09-27", text = "Partner B (Salman) starts picking up Partner B's backlog directly, since Ibrahim is stepping back from active contribution for a while. Before starting on the prescribed AI-layer work, fixed a real bug Salman hit running the app locally: every page other than Submit crashed with the app's own \"This page stopped working\" boundary as soon as the backend was unreachable (e.g. no Docker running). Root cause: stats.ts/meta.ts/complaints.ts treated the parsed error body's truthiness, not response.ok, as the signal that a request had failed; the dev proxy answers an unreachable backend with a 500 that has an empty, non-JSON body, which parses to a falsy `error`, so the check silently passed and StatsPage crashed reading `.stats.total` off a `data` object that looked loaded but was not. Fixed by checking `error || !response.ok` everywhere (keeping the `error` check too, since openapi-fetch's TS types only narrow `data` to defined off that check, not off response.ok -- dropping it re-broke typecheck across four files). Committed separately on fix/stats-page-crash-on-api-failure pending push." },
  { date = "2026-09-27", text = "C0-04: froze the triage seam -- app/providers/triage/base.py (TriageResult, the TriageProvider Protocol) and app/services/triage_service.py (TriageOutcome, TriageService.triage()/recent_outcomes()/active_provider). TriageCache and OutcomeSink are Protocols with Null* default implementations, so the skeleton works today without AI-08's Redis cache or AI-10's Redis outcome log -- both will satisfy the same Protocols later without touching TriageService's constructor or callers. tests/fakes.py::StubTriageService added per the plan so ComplaintService (BE-03) can be coded against the seam before AI-04 lands." },
  { date = "2026-09-27", text = "AI-01: RuleBasedTriage (app/providers/triage/rules.py), matching the plan's keyword table verbatim -- 93.9% category accuracy (31/33) against the seed set, well over the required 70%, so no tuning was needed. Shared normalize()/first_sentence() helpers split into app/providers/triage/text.py so AI-08's cache can reuse the same normalize() later. 6 tests: the accuracy threshold, determinism, high-risk and low-hint priority rules, the other-category fallback, and totality against 6 edge-case strings (max length, punctuation-only, non-Latin script, mixed case, combining-character normalization)." },
  { date = "2026-09-27", text = "AI-02: SimulatedTriage (app/providers/triage/simulated.py) and the shared parse_triage_output/MalformedOutput (app/providers/triage/parsing.py, which AI-04's GroqTriage will reuse as-is). All four failure modes (raise, timeout, malformed, rate_limited) produce the exact exception types TriageService's retry policy (AI-05) will need to distinguish, including a real openai.RateLimitError built from a fake httpx.Response rather than a hand-rolled stand-in. 7 tests, including a monkeypatched socket.socket that asserts a normal call opens no socket at all (\"no network, ever\")." },
  { date = "2026-09-27", text = "AI-03: TriageService skeleton + fallback (app/services/triage_service.py). Writing the fallback test surfaced a real bug in the plan's own literal code: its triage() snippet caches the primary's result unconditionally on success, contradicting its own stated design (\"no cache is used [for rules], since rules are cheaper than Redis\") -- a rules-as-primary run would still round-trip Redis on every request. Guarded the cache write with the same `primary.name != \"rules\"` check already used on the read side. 8 tests: A1 (AlwaysRaisesProvider -> rules:fallback), successful/cached/rules-primary paths, and that CancelledError propagates instead of being swallowed (needed for BE-06's graceful shutdown later)." },
  { date = "2026-09-27", text = "CI-01: .github/workflows/ci.yml with the five checks that don't need Docker or Kubernetes yet -- lint-and-type, contract, status, test-backend, test-frontend (build/scan/manifests/integration wait for CI-02/CI-03 once DK-01..03 exist). Before shipping it, ran every job's exact commands locally to make sure a clean PR is actually green, not just plausible, and that surfaced two more pre-existing issues: a real mypy error in complaint_repository.py (get_status_stmt was typed Select[Any], so get_status() silently returned Any instead of Status | None -- fixed by typing it Select[Status]), and a Node-version trap in the frontend test job (this sandbox's Node 24 fails 2 tests with an AbortSignal cross-realm error from MSW's interceptor against Node's undici; confirmed clean on a portable Node 22.20.0, which is what ci.yml actually pins, so left the test code untouched). Full local dry run once both were fixed: backend ruff/format/mypy clean, 102 tests passing at 87.9% coverage; frontend lint/typecheck clean, 29 tests passing, build succeeds; openapi.json and schema.d.ts both drift-free; STATUS.md in sync." },
  { date = "2026-09-27", text = "AI-05: TriageService timeout and retry policy (_call_primary() under asyncio.timeout(10s), exactly one retry for the RETRYABLE set only; sleep/rng injectable for deterministic tests). OllamaServerError moved to its own app/providers/triage/errors.py since RETRYABLE needs it ahead of AI-09. 14 tests (A3-A7 plus one for the successful-retry path); added S311 to the tests ruff ignore list (seeded random.Random() for deterministic timing, the same kind of case S106 already covers)." },
  { date = "2026-09-27", text = "FE-10 revisited: the ownership-swap plan (above) had B write the frontend test suite, but in practice A's own FE-05/06/07/08/09 PRs already wrote all 12 tests plan section 8.14 names for this task (6 in SubmitPage, 4 in Dashboard, the X-Cache test in Stats, and a crash-and-recover test already in routing.test.tsx covering the same behavior section 8.14 names ErrorBoundary.test.tsx for) -- 29 tests total, confirmed green in CI. Rather than write a redundant test file just to have a B-owned commit against this task ID, marking it done under owner A, since that's who actually holds the commits: task-ID ownership is bookkeeping, but A2/A4 (commit-split >= 35% each) is graded on real commit authorship, and this would have misrepresented it." },
  { date = "2026-09-27", text = "AI-06: prompt module (app/providers/triage/prompt.py, PROMPT_VERSION + SYSTEM + build_messages with delimiter neutralization) and the safety floor (_apply_safety_floor in triage_service.py): a HIGH_RISK keyword in the complaint text always forces priority=high, regardless of what the primary returned, applied on both a fresh primary success and a cache hit (proven with a cache seeded directly, bypassing write-time application, to show the read-time floor also catches it). A11 (the brief's injection test) needed no new mechanism at all: an LLM asked to return category='hacked' produces an invalid enum value, which is already MalformedOutput under AI-02/AI-03's existing validation, so it already falls back to rules -- the injection test is really proving the fallback path, not a new guardrail. 9 tests: A11, A12 (delimiter neutralization, both directions), A13 (safety floor overriding a valid-but-wrong low priority), plus that the floor leaves a correct high priority and ordinary text alone." },
  { date = "2026-09-27", text = "AI-07 + DOC-05: PII redaction (app/providers/triage/redaction.py::redact(), the plan's four patterns verbatim -- PK mobile, CNIC, email, house/plot address) and ADR 0004. Verified against the real seed data, not just hand-picked examples: three rows in app/seed/complaints.json actually contain a house number in text or location, and redact() catches all three. The ADR is written to distinguish what already exists (redact() itself, parsing.py's include_input=False) from what AI-04's not-yet-built GroqTriage is required to do (call redact(), never send reporter_contact/location) -- test A15 verifies that requirement once AI-04 lands. 14 tests (A14 parametrized over every pattern, plus that ordinary numbers and addresses are left alone)." },
  { date = "2026-09-28", text = "Timeline compressed to \"finish tonight\": dropped the week-based sequencing and batched seven tightly-coupled backend/AI tasks in one run instead of one task per PR -- AI-11 (provider factory), AI-10 (Redis outcome log + real /api/meta/providers), BE-03 (real ComplaintService, replacing the C0-05 stub routes), BE-04 (state machine + PATCH + optimistic-concurrency race guard), BE-06 (GracefulServer: SIGTERM flips readiness before uvicorn drains, not after), CA-02 (Redis fixed-window rate limiter, atomic INCR+EXPIRE via Lua), BE-08 (AST-based architecture test; OpenAPI 400 cleanup was already done by C0-05). Testing all seven together surfaced issues a one-task-at-a-time pass would have hit piecemeal anyway, worth listing because they explain real code choices: (1) the CA-02 tests need fakeredis's real Lua backend (`lupa`), missing from both this sandbox and the dev dependency group -- added it and regenerated uv.lock (uv itself had to be installed fresh here to do that). (2) mypy under the *actually pinned* SQLAlchemy 2.0.54 (this sandbox had drifted to 2.1.1 again) flagged a real bug in outcomes.py: redis-py 5.3.1's lrange() stub returns a union type that fails a bare `await`; fixed with an explicit Awaitable cast. (3) Two pre-existing observability tests (U8, I15) built their TestClient without entering the app lifespan, which the C0-05 stub routes never needed but the new real routes do -- fixed by entering it (U8) or faking the dependency directly (I15, since /health/ready/metrics are deliberately excluded from request-completed logging and can't stand in). (4) test_contract.py's create-complaint test now genuinely needs a live Postgres now that BE-03 wired the real service, and conftest.py has no testcontainers fixtures yet (that's BE-07/CI-02's job) -- marked it `integration` and excluded that marker in ci.yml's test-backend job rather than leave a test CI cannot actually pass. 249 tests passing (1 deselected), 91.6% coverage; ruff/format/mypy clean under the CI-accurate uv-managed venv; no OpenAPI drift." },
  { date = "2026-09-28", text = "BE-07 closed out: the 249-test / 91.6%-coverage suite from the batched run above already exceeds the plan's 30+/>=70% acceptance bar, so the remaining work was tightening the enforced floor to match rather than adding tests for their own sake. Raised coverage.report.fail_under from 65 to 70 in backend/pyproject.toml, and the matching --cov-fail-under flag in ci.yml's test-backend job from 65 to 70, so both local and CI runs honestly enforce the plan's stated target instead of a looser placeholder. Reran the exact CI command afterward: 249 passed, 1 deselected, 91.59% coverage, comfortably above the new floor. The one remaining gap -- the integration-marked create-complaint test needing real Postgres/Redis -- is out of scope here: ci.yml's own comment assigns that to CI-02's Compose integration job (owner B), not to BE-07's testcontainers wiring, so conftest.py is left as-is." },
  { date = "2026-09-28", text = "AI-04 (code + tests only, human step still pending): GroqTriage (app/providers/triage/llm.py) -- an AsyncOpenAI client pointed at Groq's OpenAI-compatible endpoint, max_retries=0 so TriageService (AI-05) owns the single retry, JSON mode, temperature=0. Wired into factory.py: TRIAGE_PROVIDER=llm now selects it when groq_api_key is set, and still degrades to rules with an ERROR log (not a crash) when it is not, matching the plan's own build_primary snippet exactly. redact() runs on the complaint text before it is sent, and location/reporter_contact are never included in the request at all -- both proven by inspecting the actual call kwargs sent to a mocked client, the same no-live-call testing pattern AI-01/02/05/06 already used (no respx dependency needed for this). 9 new tests in test_llm_triage.py (A2: malformed JSON and an invalid enum value both raise MalformedOutput rather than being accepted best-effort; A15: no location/contact, PII redacted; plus the max_retries=0 / JSON-mode / model wiring itself) and 2 updated tests in test_factory.py. 260 tests passing (1 deselected), 91.75% coverage; ruff/format/mypy clean -- mypy needed one explicit cast, since build_messages()'s list[dict[str, str]] does not structurally match the SDK's ChatCompletionMessageParam TypedDict union. What is NOT done here, per the plan's own AI-04 acceptance ('manual call succeeds'): no real Groq key exists in this sandbox, so the one live call against the actual API has not been made. Left status in_progress rather than done until that human step happens." },
  { date = "2026-09-29", text = "Root-caused and fixed a real bug in DB-02's own Alembic env.py while getting the stack running locally for the first time with Docker Desktop finally stable: do_run_migrations's advisory-lock SELECT (`pg_advisory_lock`) autobegins a real SQLAlchemy transaction before context.begin_transaction() runs, so alembic nests the actual migration inside a SAVEPOINT instead of a top-level transaction; run_async_migrations then used engine.connect() (closes without committing) instead of engine.begin() (commits on clean exit), so every `alembic upgrade head` printed a normal success line and genuinely executed the DDL, then silently rolled the whole thing back the instant the connection closed. Diagnosed by ruling out the more obvious suspects first (IPv6/wslrelay port collision, a second Postgres on the same port, a restarted container with a fresh volume -- all checked and cleared) before reading env.py itself. One-line fix: connectable.begin() instead of connectable.connect(). Confirmed fixed against both the manually-run postgres:16-alpine container and, later the same day, the new compose-managed one -- `\\dt` now shows complaints + alembic_version after every run, and the seed CLI inserted all 33 rows." },
  { date = "2026-09-29", text = "DK-01 + DK-03: backend/Dockerfile (multi-stage: uv==0.5.11 in a python:3.12-slim builder installing frozen deps with --no-install-project before app code is copied in, so editing app code never invalidates the dependency layer; non-root `app` user in the runtime stage; exec-form CMD [\"python\", \"-m\", \"app.server\"] so SIGTERM reaches BE-06's GracefulServer directly, not a shell). compose.yaml adds the data tier only (DK-04 wires the app services): `database`/`cache` service names match Settings' own defaults exactly, so the backend needs zero host overrides once attached; an `internal: true` network with no published ports; Redis with --appendonly yes on a named volume (redis-data) since the rate limiter's window counters and the outcome ring buffer are live state a bare restart shouldn't reset; both services have real healthchecks (pg_isready; redis-cli -a <password> ping, using compose's own parse-time ${VAR} substitution after an escaping bug -- $${REDIS_PASSWORD} -- made the first attempt fail with WRONGPASS since nothing had put the variable into the container's own runtime env). .env.example added at the repo root (POSTGRES_PASSWORD, REDIS_PASSWORD); .gitignore already covered .env. Verified for real, not just `compose config`: built the image, brought the data tier up, ran `alembic upgrade head` and the seed CLI from inside the built image against it (both succeeded, confirming the DB-02 fix above holds under Docker too, not just the manual container), ran the backend image itself joined to the network and hit /health, /ready (postgres+redis both \"ok\") and /api/stats over a real request, and confirmed a container NOT on the `data` network cannot resolve `database` at all -- proving the network isolation rubric (G3) actually holds, not just that the YAML says internal: true." },
  { date = "2026-09-29", text = "DK-02 (backend half): .dockerignore excludes both local venvs, tests/, caches and .env* from the build context. Measured, not assumed: a naive single-stage Dockerfile (python:3.12 full, one RUN uv sync with build tools left in) produced a 1.9GB image; the multi-stage slim build above produces 276MB -- an 85% reduction. The naive Dockerfile and its image were throwaway, used only to get this number, and were deleted afterward. Left in_progress: DK-02's other context (frontend) is FE-11's job (nginx template + frontend Dockerfile), not yet done." },
  { date = "2026-09-28", text = "AI-08 (cache + hit-rate mechanism done; the duplicate-replay measurement is the pending human step): app/providers/triage/cache.py::TriageResultCache, wired into factory.py's build_triage_service so TRIAGE_PROVIDER=llm/ollama now actually get a Redis-backed cache instead of the permanent-miss NullTriageCache. Key excludes location on purpose (plan section 11.7: nine neighbours reporting the same burst main should cost one inference) and includes provider/model/PROMPT_VERSION so switching any of them can never serve a stale classification. Hit/miss counters (triage:stats:hits/misses) live in Redis, not memory, for the same distributed-state reason AI-10's OutcomeLog does -- proven across two TriageResultCache instances sharing one fakeredis, the same pattern test_outcomes.py's A16 already used. Added TriageCache.hit_rate() to the Protocol (NullTriageCache returns None) and TriageService.cache_hit_rate(), so MetaService now reports the real measured rate through /api/meta/providers instead of the AI-08-shaped None placeholder -- the one route change in this task, and it only reads through TriageService's existing public surface, per that module's own layering rule. 12 new tests (test_triage_cache.py: hit/miss/key-shape/TTL/hit-rate; plus 3 more in test_triage_service.py and 2 updated in test_meta_service.py). 271 tests passing, 91.96% coverage (triage_service.py itself now 100%); ruff/format/mypy clean; confirmed no OpenAPI drift (no route shape changed, only its cache_hit_rate value stopped being hardcoded). What is NOT done: the plan's own AI-08 acceptance needs a measured hit rate from replaying load/duplicates.jsonl against a real Groq key (docs/TRIAGE.md, DOC-09) -- that dataset and that replay script do not exist yet either, and both need a real key this sandbox doesn't have. Left status in_progress rather than done." },
  { date = "2026-09-29", text = "DOC-02: docs/adr/0001-provider-interface.md, justifying the two design decisions behind app/providers/triage/base.py::TriageProvider -- async over the brief's own printed sync signature (every real provider is I/O-bound, and TriageService needs one generic await path under asyncio.timeout(), not a per-provider sync/async branch), and Protocol over an ABC (no shared behaviour to inherit, and RuleBasedTriage's dual role as both a provider and TriageService's fallback would make an ABC's inheritance mean something it doesn't). Verified two claims against the actual code before writing them down rather than assuming from the plan's prose: runtime_checkable is genuinely decorative today (grepped for isinstance(x, TriageProvider) -- zero hits), and triage_sync() has exactly two real callers (TriageService's fallback path and SimulatedTriage), not three as first drafted -- the safety floor turned out to check HIGH_RISK keywords directly rather than calling into RuleBasedTriage at all." },
  { date = "2026-09-29", text = "FE-12: confirmed the two halves of \"switch from MSW to the real API\" that were already true (MSW is opt-in behind VITE_USE_MSW and dead-code-eliminated from the production build since FE-03; the typed client already calls the real endpoints, so there was never a literal \"switch\" to perform) and found the one real contract mismatch: app/pages/ComplaintDetailPage.tsx was still FE-02's original placeholder (\"Placeholder until the API client exists\"), rendering only the raw id, even though the real GET /api/complaints/{id} route (BE-03) and its typed useComplaint(id) hook had existed for a while unused. Wired it up per plan section 8.11: full text, all fields, StatusActions, both timestamps, and a 404/400 rendered the same way -- the server's message verbatim plus a link back to the dashboard, matching the app's existing rule that the frontend never rewrites what the backend said. 2 new tests. Verified without a live backend (no Postgres in this sandbox): npm run gen:api + check:contract show zero drift between the committed openapi.json and schema.d.ts, and the full suite (31 tests), typecheck, lint, and build are all clean." },
  { date = "2026-09-29", text = "CI-02: .github/workflows/ci.yml gains an integration job, now that DK-04 landed the full compose.yaml app tier (backend + frontend services, not just the data tier). Adapted the plan's own reference script rather than copying it, after actually reading the two files it assumes: frontend/nginx/default.conf.template only has location /api/ -- the plan's curl \"$B/healthz\" check hits no such path and would silently fall through to the SPA's try_files, returning the frontend's index.html (a 200, so the check would \"pass\" while proving nothing about the backend) -- dropped it; the POST that follows already proves the backend is reachable through the proxy, which is a stronger check anyway. Also compose.yaml's `seed` service has no healthcheck and is not a dependency of `backend` (only of migrate completing), so `--wait` does not guarantee its 33 rows have landed by the time the smoke test queries the list endpoint -- replaced the plan's single assertion with a bounded retry loop (up to 60s) polling the total, rather than a check that could flake on timing alone. Verified everything short of actually running Docker, which this sandbox does not have: the YAML parses (python -c \"import yaml; ...\"), every run: block passes bash -n, the X-Cache header name/casing was cross-checked against app/routes/stats.py, and the TRIAGE_PROVIDER default was cross-checked against both compose.yaml and Settings. Left status in_progress rather than done: the first real docker compose up this script ever sees will be in CI itself, not this sandbox, so it needs to survive one real run before being trusted." },
  { date = "2026-09-29", text = "AI-09 (provider code + tests done; installing a model and measuring latency is the pending human/DK-06 step): app/providers/triage/ollama.py::OllamaTriage, matching the plan's exact design -- POST /api/chat with stream=false and format=TriageResult.model_json_schema() so Ollama's structured-output mode constrains decoding, options.temperature=0. Unlike GroqTriage it applies no PII redaction, since nothing leaves the machine running Ollama; also unlike GroqTriage it does not own its http client -- OllamaTriage takes a shared httpx.AsyncClient, so app/core/lifecycle.py now opens one real client at startup (app.state.http) and closes it at shutdown alongside Redis and the DB engine, and factory.py threads it through build_triage_service/build_primary. A 5xx maps to the already-retryable OllamaServerError; a 4xx still raises (via raise_for_status()) but as a plain httpx.HTTPStatusError, deliberately not retried, the same as GroqTriage's 400/401/403. 13 new/updated tests (8 for OllamaTriage: valid parse, request shape, no-redaction, 5xx vs 4xx handled differently, malformed/invalid-enum both fall back safely; 5 updated in test_factory.py for the new http-threading signature, plus a new ollama selection test). 280 tests passing, 92.26% coverage; ruff/format/mypy clean; confirmed no OpenAPI drift. What is NOT done: the plan's own AI-09 acceptance needs an actual model installed (`make offline`, DK-06, owner B) and measured latency p50/p95 against the seed set for docs/TRIAGE.md -- no Ollama binary or Docker in this sandbox to do either. Left status in_progress rather than done." },
  { date = "2026-09-29", text = "FE-11 + DK-04: frontend/Dockerfile (multi-stage: node:22.20.0-alpine builds the Vite bundle, nginxinc/nginx-unprivileged:1.27-alpine serves it -- non-root by default, 74.3MB). Runtime config is a single env var, not a JS config blob: the client already used a relative baseUrl (src/api/client.ts, plan section 8.1's own ban on VITE_API_*), so the only per-environment knob left is where nginx proxies /api/ to -- frontend/nginx/default.conf.template's ${BACKEND_HOST}/${BACKEND_PORT} are envsubst'd by nginx's own entrypoint scripts at container start, so the identical built image works in compose (BACKEND_HOST=backend) and later in Kubernetes (a Service DNS name) without a rebuild (rubric B4). One real bug caught building it: frontend/.dockerignore's first draft excluded tests/ wholesale, which broke `tsc -b` -- main.tsx dynamically imports tests/msw/browser (dead-code-eliminated from the actual bundle by Vite, but still resolved at compile time), so only node_modules/dist/coverage/.vite are excluded, not tests/ itself. compose.yaml gained the app tier: migrate and seed as one-shot services (restart: \"no\", gated on service_healthy / service_completed_successfully so seed can never race migrate), backend healthchecked via its own venv's python hitting /health (no curl/wget in python:3.12-slim), frontend on a second, non-internal `app` network -- attached to the backend, never to `data`. Root Makefile (`make up` == `docker compose up -d --build`). Verified for real: brought the whole stack up from cold with `docker compose up -d --build`, confirmed the dependency chain actually gated correctly (migrate ran and exited 0 before seed started, seed exited 0 before backend's healthcheck could pass, frontend didn't start until backend was healthy), hit the frontend's published port and got a real 200 with real seeded data through the nginx proxy (`GET :8080/api/stats` -> 33 complaints), and confirmed from inside the frontend container itself that `database` doesn't even resolve -- G3's network isolation holds with the full app tier wired in, not just the bare data tier from DK-03." },
  { date = "2026-09-29", text = "DOC-08: docs/AI-USAGE.md, written from this session's own real record (docs/progress.toml's [[log]] entries and actual git history) rather than a generic AI-usage template. Names the tool (Claude Code / Claude Sonnet 5) and covers, with specific file/task citations: what it was used for, four verbatim representative prompts from this session, and eight concrete rejected-or-corrected cases spanning a bug in the plan's own reference code (AI-03), a real Alembic naming bug (DB-02), two real mypy --strict catches (CI-01, AI-10), a rejected sync interface from the brief itself (DOC-02/ADR 0001), a factual error in Claude's own first ADR 0001 draft caught and fixed before commit, an avoided-not-corrected redundant test file (FE-10), and a too-loose coverage floor (BE-07). Left status in_progress: the task's own human field asks you to confirm the account is accurate, and asks Salman to add his own AI-tool-usage row rather than have it written on his behalf." },
]

