#
# After every task:
#   1. set its status ("todo" | "in_progress" | "done" | "blocked") and, when done, done = "YYYY-MM-DD"
#   2. add a [[log]] entry
#   3. run:  python scripts/update_status.py
#   4. commit docs/progress.toml and STATUS.md in the same PR as the work
#
# Owners: "A" = frontend + backend + data layer, "B" = AI layer + DevOps, "Both".
#   owner = whose GitHub account commits the work and who defends it first at the viva.
# who   = who does the hands-on work (IMPLEMENTATION_PLAN.md §0.6):
#   "claude"      Claude writes it, runs its tests, prepares the commit and PR
#   "claude+you"  Claude writes it; you run commands on your machine / GitHub and paste the output back
#   "you"         needs you personally; Claude gives step-by-step instructions at the time
#   "partner"     needs your partner personally (his reviews, his commits)
# human = optional: exactly what the person does, when it isn't just "run the commands and paste the output"
# week = planned week (1-4) from IMPLEMENTATION_PLAN.md §6; used to order "Up next".
